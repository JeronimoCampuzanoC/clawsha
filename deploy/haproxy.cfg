# Local stand-in for the internal NLB: one address (master-lb:50051) that always
# points at the current leader. Like the NLB in AWS, it health-checks
# /health/leader (200 only on the leader) and sends gRPC to whoever answers.

global
    log stdout format raw local0
    maxconn 256

defaults
    mode tcp
    log global
    timeout connect 3s
    timeout client  1h
    timeout server  1h

# Docker's embedded DNS: a recreated master gets a new IP, and without this
# HAProxy would keep the one it resolved at startup.
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s

frontend grpc
    bind *:50051
    default_backend masters

backend masters
    option httpchk
    http-check send meth GET uri /health/leader
    http-check expect status 200
    # on-marked-down: drop open connections when the leader changes, so clients
    # reconnect to the new one instead of talking to a standby.
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions resolvers docker resolve-prefer ipv4 init-addr last,libc,none
    server master-a master-a:50051 check port 8080
    server master-b master-b:50051 check port 8080
