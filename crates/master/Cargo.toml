[package]
name = "master"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
aws-config = { version = "1.12.0", features = ["behavior-version-latest"] }
aws-sdk-cloudwatch = "1.134.0"
aws-sdk-dynamodb = "1.130.0"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
dotenvy = "0.15.7"
hex = "0.4.3"
prost = "0.14"
rand = "0.10.3"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "time", "sync", "signal"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tonic = "0.14"
tonic-prost = "0.14"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.28.0", features = ["v4"] }

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
bytes = "1.12.1"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = "0.1.21"
sha2 = "0.11.0"
tower = "0.5.3"
