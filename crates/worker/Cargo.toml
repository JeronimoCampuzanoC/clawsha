[package]
name = "worker"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
dotenvy = "0.15.7"
prost = "0.14.4"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = "1.27.0"

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
tonic-prost-build = "0.14.6"
