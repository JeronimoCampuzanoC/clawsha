syntax = "proto3";

package dfs.v1;

// ---------------------------------------------------------------------------
// WorkerService: what a worker (DataNode) offers to gateways, the master and
// other workers. Owner: B.
// ---------------------------------------------------------------------------
service WorkerService {
  rpc PutBlock(stream BlockFrame) returns (PutBlockResponse);
  rpc GetBlock(GetBlockRequest) returns (stream BlockFrame);
}

message BlockFrame {
  oneof kind {
    BlockHeader header = 1;
    DataFrame data = 2;
  }
}

message BlockHeader {
  string block_id = 1;      // UUID
  bytes sha256 = 2;         // raw digest, exactly 32 bytes
  uint64 size = 3;          
  string next_worker = 4;   //host:port of the next worker in the chain
}

message DataFrame {
  bytes data = 1;           // up to 256 KiB
  fixed32 crc32c = 2;    
}

message PutBlockResponse {
  string block_id = 1;
  uint64 stored_bytes = 2;
}

message GetBlockRequest {
  string block_id = 1;
  uint64 offset = 2;       
}

// ---------------------------------------------------------------------------
// MasterService: gateway -> master. Owner: A.
//
// The gateway always dials the internal NLB, which only routes to the master
// that currently holds the leader lease. A standby master answers every call
// with UNAVAILABLE so the gateway retries.
//
// Every request carries the user_id the gateway took from the JWT. The master
// trusts it because the gateway authenticates with its mTLS certificate.
// Paths are absolute inside the user's own tree ("/docs/a.pdf"); a path that
// belongs to another user simply does not exist (NOT_FOUND).
//
// Status codes the gateway maps to HTTP:
//   NOT_FOUND           -> 404   path does not exist (or is not yours)
//   ALREADY_EXISTS      -> 409   mkdir on an existing name, duplicate username
//   FAILED_PRECONDITION -> 409   folder not empty, path locked by another writer
//   INVALID_ARGUMENT    -> 400   bad path, short password, bad sizes
//   UNAUTHENTICATED     -> 401   wrong username/password
//   UNAVAILABLE         -> 503   not leader, no 2 workers to write, no replica to read
// ---------------------------------------------------------------------------
service MasterService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);

  rpc List(PathRequest) returns (ListResponse);
  rpc Mkdir(PathRequest) returns (Empty);
  rpc Remove(RemoveRequest) returns (Empty);
  rpc Move(MoveRequest) returns (Empty);
  rpc Stat(PathRequest) returns (StatResponse);

  // Upload: StartUpload hands out block ids and a worker pair per block,
  // ReassignBlock replaces a pair that failed, CommitUpload makes the new
  // version visible atomically, AbortUpload drops it.
  rpc StartUpload(StartUploadRequest) returns (UploadPlan);
  rpc ReassignBlock(ReassignBlockRequest) returns (BlockAssignment);
  rpc CommitUpload(CommitUploadRequest) returns (FileInfo);
  rpc AbortUpload(AbortUploadRequest) returns (Empty);

  rpc GetReadPlan(ReadPlanRequest) returns (ReadPlan);
  rpc ReportCorruption(CorruptionReport) returns (Empty);

  // Explicit write lock on a path (RF3 lock). Uploads take the same lease.
  rpc AcquireLease(LeaseRequest) returns (Lease);
  rpc ReleaseLease(Lease) returns (Empty);

  // Feeds the dashboard: who is leader, which workers are alive, usage.
  rpc ClusterStatus(Empty) returns (ClusterStatusResponse);
}

// ---------------------------------------------------------------------------
// ClusterService: worker -> master. Owner: A (contract) / B (worker side).
// ---------------------------------------------------------------------------
service ClusterService {
  // Every 3 s. Carries usage and the blocks added/removed since the previous
  // heartbeat. The answer tells the worker the current leader fencing; when it
  // changes, or when full_report_requested is set, the worker sends BlockReport.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  // Full list of blocks on disk. Sent at startup, every 5 min and whenever the
  // fencing changes. This is the source of truth for block locations.
  rpc BlockReport(BlockReportRequest) returns (Empty);
}

message Empty {}

// ----- users ---------------------------------------------------------------

message RegisterRequest {
  string username = 1;
  string password = 2;      // at least 8 characters
}

message RegisterResponse {
  string user_id = 1;       // UUID; the gateway puts it in the JWT
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string user_id = 1;
}

// ----- namespace -----------------------------------------------------------

message PathRequest {
  string user_id = 1;
  string path = 2;          // absolute, e.g. "/docs/a.pdf"; "/" is the user's root
}

enum EntryType {
  ENTRY_TYPE_UNSPECIFIED = 0;
  DIR = 1;
  FILE = 2;
}

message Entry {
  string name = 1;
  EntryType type = 2;
  uint64 size = 3;          // 0 for directories
  int64 modified_at = 4;    // unix time, milliseconds
  string inode_id = 5;
}

message ListResponse {
  repeated Entry entries = 1;
}

message RemoveRequest {
  string user_id = 1;
  string path = 2;
  bool recursive = 3;       // required to remove a non-empty directory
}

message MoveRequest {
  string user_id = 1;
  string from = 2;
  string to = 3;            // full destination path, including the new name
}

message WorkerAddr {
  string worker_id = 1;
  string addr = 2;          // host:port of the worker's gRPC endpoint
  string az = 3;
}

message ReplicaInfo {
  WorkerAddr worker = 1;
  string disk_path = 2;     // where the worker keeps it, for the detail panel
}

message BlockStat {
  uint32 idx = 1;
  string block_id = 2;
  uint64 size = 3;
  bytes sha256 = 4;
  repeated ReplicaInfo replicas = 5;   // fewer than 2 means under-replicated
}

message StatResponse {
  Entry entry = 1;
  // Only for files:
  uint64 version_no = 2;
  bytes sha256 = 3;
  repeated BlockStat blocks = 4;
}

// ----- upload --------------------------------------------------------------

message StartUploadRequest {
  string user_id = 1;
  string path = 2;
  uint64 size = 3;
  string lease_id = 4;      // optional: a lock the caller already holds on this path
}

message BlockAssignment {
  uint32 idx = 1;
  string block_id = 2;      // UUID, new for every assignment
  uint64 size = 3;
  // Pipeline order: the gateway sends PutBlock to workers[0], which forwards
  // to workers[1]. Normally one per AZ.
  repeated WorkerAddr workers = 4;
}

message UploadPlan {
  string inode_id = 1;
  uint64 version_no = 2;
  string lease_id = 3;      // must come back in Commit/Abort
  uint64 block_size = 4;
  repeated BlockAssignment blocks = 5;
}

message ReassignBlockRequest {
  string user_id = 1;
  string inode_id = 2;
  uint64 version_no = 3;
  string lease_id = 4;
  uint32 idx = 5;
  repeated string exclude_worker_ids = 6;   // workers that just failed
}

message CommittedBlock {
  uint32 idx = 1;
  string block_id = 2;
  uint64 size = 3;
  bytes sha256 = 4;
  repeated string worker_ids = 5;   // the workers that acked the write
}

message CommitUploadRequest {
  string user_id = 1;
  string path = 2;
  string inode_id = 3;
  uint64 version_no = 4;
  string lease_id = 5;
  uint64 size = 6;
  bytes sha256 = 7;         // of the whole file
  repeated CommittedBlock blocks = 8;
}

message FileInfo {
  string path = 1;
  string inode_id = 2;
  uint64 version_no = 3;
  uint64 size = 4;
  bytes sha256 = 5;
  uint32 block_count = 6;
  int64 modified_at = 7;
}

message AbortUploadRequest {
  string user_id = 1;
  string inode_id = 2;
  uint64 version_no = 3;
  string lease_id = 4;
}

// ----- read ----------------------------------------------------------------

message ReadPlanRequest {
  string user_id = 1;
  string path = 2;
  uint64 version_no = 3;    // 0 = current version; open() pins one explicitly
}

message BlockLocation {
  uint32 idx = 1;
  string block_id = 2;
  uint64 size = 3;
  bytes sha256 = 4;
  repeated WorkerAddr replicas = 5;   // only workers believed alive
}

message ReadPlan {
  string inode_id = 1;
  uint64 version_no = 2;
  uint64 size = 3;
  bytes sha256 = 4;
  uint64 block_size = 5;
  repeated BlockLocation blocks = 6;
}

message CorruptionReport {
  string block_id = 1;
  string worker_id = 2;     // the replica whose hash did not match
}

// ----- leases --------------------------------------------------------------

message LeaseRequest {
  string user_id = 1;
  string path = 2;
  uint32 ttl_seconds = 3;   // 0 = default (60 s)
  string lease_id = 4;      // set to renew a lease you already hold
}

message Lease {
  string lease_id = 1;
  string inode_id = 2;
  int64 expires_at = 3;     // unix time, milliseconds
}

// ----- cluster -------------------------------------------------------------

message HeartbeatRequest {
  string worker_id = 1;
  string addr = 2;          // host:port where the worker serves WorkerService
  string az = 3;
  uint64 quota_bytes = 4;
  uint64 used_bytes = 5;
  repeated string new_blocks = 6;       // since the previous heartbeat
  repeated string removed_blocks = 7;
  string data_dir = 8;      // optional, only to show disk paths in stat
}

message HeartbeatResponse {
  uint64 fencing = 1;
  bool full_report_requested = 2;   // the leader does not know this worker yet
}

message BlockEntry {
  string block_id = 1;
  uint64 size = 2;
  bytes sha256 = 3;
}

message BlockReportRequest {
  string worker_id = 1;
  repeated BlockEntry blocks = 2;
}

enum WorkerState {
  WORKER_STATE_UNSPECIFIED = 0;
  ALIVE = 1;      // heartbeat in the last 10 s
  SUSPECT = 2;    // 10 to 30 s without heartbeat: gets no new blocks
  DEAD = 3;       // more than 30 s: its blocks must be re-replicated
}

message WorkerStatus {
  WorkerAddr worker = 1;
  WorkerState state = 2;
  uint64 quota_bytes = 3;
  uint64 used_bytes = 4;
  uint64 block_count = 5;
  int64 last_heartbeat = 6;   // unix time, milliseconds
}

message ClusterStatusResponse {
  string master_id = 1;
  bool is_leader = 2;
  uint64 fencing = 3;
  bool safe_mode = 4;            // right after a failover, until workers report
  repeated WorkerStatus workers = 5;
  uint64 under_replicated_blocks = 6;
  uint64 total_blocks = 7;
}
