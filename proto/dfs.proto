syntax = "proto3";

package dfs.v1;

// Single entry point: build scripts compile this file and get everything.
//   common.proto   types shared by several services (Empty, WorkerAddr)
//   worker.proto   WorkerService: gateway/worker block transfer
//   master.proto   MasterService: gateway -> master
//   cluster.proto  ClusterService: worker -> master (heartbeat, block report)
import public "common.proto";
import public "worker.proto";
import public "master.proto";
import public "cluster.proto";
